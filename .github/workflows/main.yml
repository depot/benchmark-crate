---
name: CrateDB SQL
on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 5,17 * * *"

jobs:
  test-gha:
    name: Test CrateDB SQL on GHA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: crate/crate
          ref: master
      - name: Setup Maven Java
        uses: actions/setup-java@v4
        with:
          java-version: "23"
          distribution: "temurin"
          cache: maven

      - name: Run tests on ${{ matrix.os }}
        env:
          CRATE_TESTS_SQL_REQUEST_TIMEOUT: "20"
        run: |
          mvn test \
            -Dtests.crate.run-windows-incompatible=true \
            -DforkCount=2 \
            -DthreadCount=2 \
            -Dcheckstyle.skip \
            -Dforbiddenapis.skip=true \
            -Dmaven.javadoc.skip=true \
            -Djacoco.skip=true

  forbiddenApis-gha:
    name: forbiddenApis on GHA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: crate/crate
          ref: master
      - name: Setup Maven Java
        uses: actions/setup-java@v4
        with:
          java-version: "23"
          distribution: "temurin"
          cache: maven
      - name: Run forbiddenapis:check
        run: |
          mvn compile forbiddenapis:check

  checkstyle-gha:
    name: checkstyle on GHA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: crate/crate
          ref: master
      - name: Setup Maven Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"
      - name: Run checkstyle
        run: mvn compile checkstyle:checkstyle

  test-depot:
    name: Test CrateDB SQL on Depot
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: crate/crate
          ref: master
      - name: Setup Maven Java
        uses: actions/setup-java@v4
        with:
          java-version: "23"
          distribution: "temurin"
          cache: maven

      - name: Run tests on ${{ matrix.os }}
        env:
          CRATE_TESTS_SQL_REQUEST_TIMEOUT: "20"
        run: |
          rm -rf plugins/es-repository-s3/src/test/
          mvn test \
            -Dtests.crate.run-windows-incompatible=true \
            -DforkCount=2 \
            -DthreadCount=2 \
            -Dcheckstyle.skip \
            -Dforbiddenapis.skip=true \
            -Dmaven.javadoc.skip=true \
            -Djacoco.skip=true

  forbiddenApis-depot:
    name: forbiddenApis on Depot
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: crate/crate
          ref: master
      - name: Setup Maven Java
        uses: actions/setup-java@v4
        with:
          java-version: "23"
          distribution: "temurin"
          cache: maven
      - name: Run forbiddenapis:check
        run: |
          mvn compile forbiddenapis:check

  checkstyle-depot:
    name: checkstyle on Depot
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: crate/crate
          ref: master
      - name: Setup Maven Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"
      - name: Run checkstyle
        run: mvn compile checkstyle:checkstyle
